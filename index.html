<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пригласительное на Кыз Узатуу</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Базовые стили на чистом CSS */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: #FAF6F0; color: #5A504A; min-h-screen: 100vh; overflow: hidden; position: relative; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Стили экранов */
        .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; inset: 0; width: 100%; height: 100vh; min-height: 100vh; background-color: #FAF6F0; transition: opacity 0.5s ease; z-index: 20; }
        .hidden { display: none !important; opacity: 0; }
        
        /* Экран 1: Языки */
        .lang-title { font-size: 1.25rem; font-style: italic; color: #7A6E67; margin-bottom: 2rem; tracking-wide: 0.05em; }
        .btn-container { display: flex; flex-direction: column; gap: 1rem; w-full: 100%; max-width: 280px; padding: 0 1rem; }
        .lang-btn { width: 100%; padding: 0.85rem; background-color: #ffffff; border: 1px solid #E6DFD5; color: #5A504A; border-radius: 2px; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
        .lang-btn:hover { border-color: #D4AF37; }
        
        /* Экран 2: Конверт */
        .envelope-wrapper { position: relative; width: 290px; height: 165px; cursor: pointer; perspective: 1000px; margin-top: 2rem; }
        .envelope { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; box-shadow: 0 10px 30px rgba(224, 196, 185, 0.3); }
        .flap { position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 145px solid transparent; border-right: 145px solid transparent; border-top: 95px solid #EAC4B9; transform-origin: top; transition: transform 0.5s ease, z-index 0.2s ease 0.2s; z-index: 4; }
        .pocket { position: absolute; bottom: 0; left: 0; width: 0; height: 0; border-left: 145px solid #F3D2C9; border-right: 145px solid #F3D2C9; border-bottom: 90px solid #EDC9C0; z-index: 3; }
        .stamp-seal { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; background: radial-gradient(circle, #DCC08A 0%, #C4A467 100%); border-radius: 50%; transform: translate(-50%, -45%); box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 5; transition: transform 0.4s ease, opacity 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .seal-text { font-size: 10px; color: #FAF6F0; font-style: italic; }
        .letter { position: absolute; bottom: 5px; left: 10px; width: 270px; height: 145px; background-color: #ffffff; border-radius: 2px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: transform 0.5s ease 0.3s; z-index: 2; }
        .envelope-wrapper.open .flap { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .stamp-seal { transform: translate(-50%, -45%) scale(0.8); opacity: 0; pointer-events: none; }
        .envelope-wrapper.open .letter { transform: translateY(-80px); z-index: 4; }
        .tip-text { margin-top: 2.5rem; font-size: 0.75rem; font-style: italic; color: #C2B7AE; letter-spacing: 0.1em; }
        /* Экран 3: Карточка */
        .card-container { display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 90%; max-width: 380px; height: 85vh; background-color: #FAF6F0; border: 1px solid #E6DFD5; padding: 2rem 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.02); overflow-y: auto; }
        .inv-top { font-size: 0.9rem; font-style: italic; color: #94887E; line-height: 1.6; margin-bottom: 1.5rem; }
        .inv-name { font-size: 3rem; color: #4A3E37; font-weight: 300; letter-spacing: 0.05em; margin-bottom: 1.5rem; }
        .divider { width: 40px; height: 1px; background-color: #E6DFD5; margin-bottom: 1.5rem; }
        .inv-date { font-size: 0.8rem; uppercase: uppercase; text-transform: uppercase; tracking-weight: 600; letter-spacing: 0.15em; color: #C0A080; margin-bottom: 2rem; }
        
        /* Таймер */
        .timer-box { display: flex; gap: 1rem; justify-content: center; align-items: center; margin-bottom: 2rem; width: 100%; }
        .timer-item { display: flex; flex-direction: column; align-items: center; min-width: 45px; }
        .timer-num { font-size: 1.5rem; color: #5A504A; }
        .timer-lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em; color: #A3978E; margin-top: 4px; }
        .timer-dots { color: #A3978E; font-size: 1.2rem; padding-bottom: 12px; }
        .inv-bottom { font-size: 0.9rem; font-style: italic; color: #94887E; line-height: 1.6; }
    </style>
</head>
<body>

    <canvas id="sakura" style="position: absolute; inset: 0; pointer-events: none; z-index: 50;"></canvas>

    <!-- ЭКРАН 1 -->
    <div id="lang-screen" class="screen">
        <div style="color: #D4AF37; opacity: 0.6; font-size: 1.25rem; margin-bottom: 1rem;">🌸 ─── 💮 ─── 🌸</div>
        <h1 class="lang-title font-serif">Тил · Язык · Language</h1>
        <div class="btn-container">
            <button onclick="selectLang('kg')" class="lang-btn">Кыргызча</button>
            <button onclick="selectLang('ru')" class="lang-btn">Русский</button>
            <button onclick="selectLang('en')" class="lang-btn">English</button>
        </div>
    </div>

    <!-- ЭКРАН 2 -->
    <div id="envelope-screen" class="screen hidden">
        <div class="envelope-wrapper" onclick="openEnvelope()">
            <div class="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="stamp-seal"><span class="seal-text font-serif" id="seal-name">Аяна</span></div>
                <div class="letter"></div>
            </div>
        </div>
        <p class="tip-text font-serif" id="click-tip">нажмите, чтобы открыть</p>
    </div>

    <!-- ЭКРАН 3 -->
    <div id="invitation-screen" class="screen hidden" style="padding: 1rem 0;">
        <div class="card-container">
            <div style="color: #D4AF37; opacity: 0.6; font-size: 1.1rem;">🌸 ─── 💮 ─── 🌸</div>
            <div style="width: 100%;">
                <p class="inv-top font-serif" id="inv-top-text">Приглашаем вас на кыз узатуу нашей дочери</p>
                <h1 class="inv-name font-serif">Аяна</h1>
                <div style="color: #D4AF37; font-size: 10px; margin-bottom: 1.5rem;">◆</div>
                <p class="inv-date font-serif" id="inv-date-text">Среда · 26 Августа 2026</p>
                
                <div class="timer-box">
                    <div class="timer-item"><span id="timer-days" class="timer-num font-serif">00</span><span id="lbl-days" class="timer-lbl">дней</span></div>
                    <span class="timer-dots font-serif">:</span>
                    <div class="timer-item"><span id="timer-hours" class="timer-num font-serif">00</span><span id="lbl-hours" class="timer-lbl">часов</span></div>
                    <span class="timer-dots font-serif">:</span>
                    <div class="timer-item"><span id="timer-minutes" class="timer-num font-serif">00</span><span id="lbl-minutes" class="timer-lbl">минут</span></div>
                    <span class="timer-dots font-serif">:</span>
                    <div class="timer-item"><span id="timer-seconds" class="timer-num font-serif">00</span><span id="lbl-seconds" class="timer-lbl">секунд</span></div>
                </div>
                
                <p class="inv-bottom font-serif" id="inv-bottom-text">Подарите нашей дочери своё тёплое благословение</p>
            </div>
            <div style="color: #D4AF37; opacity: 0.4; font-size: 10px;">◆ ◆ ◆</div>
        </div>
    </div>

    <script>
        const langData = {
            kg: { sealName: "Аяна", tip: "ачуу үчүн басыңыз", topText: "Сиздерди кызыбыз Аянанын кыз узатуу тоюна чакырабыз", dateText: "Шаршемби · 26-Август 2026", bottomText: "Кызыбызга өзүңүздөрдүн жылуу батаңыздарды бериңиздер", lblDays: "күн", lblHours: "саат", lblMinutes: "мүнөт", lblSeconds: "секунд" },
            ru: { sealName: "Аяна", tip: "нажмите, чтобы открыть", topText: "Приглашаем вас на кыз узатуу нашей дочери", dateText: "Среда · 26 Августа 2026", bottomText: "Подарите нашей дочери своё тёплое благословение", lblDays: "дней", lblHours: "часов", lblMinutes: "минут", lblSeconds: "секунд" },
            en: { sealName: "Aiana", tip: "click to open", topText: "We invite you to the Kyz Uzatuu ceremony of our daughter", dateText: "Wednesday · August 26, 2026", bottomText: "Give our daughter your warm blessing", lblDays: "days", lblHours: "hours", lblMinutes: "mins", lblSeconds: "secs" }
        };

        let countdownInterval;

        function selectLang(lang) {
            const data = langData[lang];
            document.getElementById('seal-name').textContent = data.sealName;
            document.getElementById('click-tip').textContent = data.tip;
            document.getElementById('inv-top-text').textContent = data.topText;
            document.getElementById('inv-date-text').textContent = data.dateText;
            document.getElementById('inv-bottom-text').textContent = data.bottomText;
            document.getElementById('lbl-days').textContent = data.lblDays;
            document.getElementById('lbl-hours').textContent = data.lblHours;
            document.getElementById('lbl-minutes').textContent = data.lblMinutes;
            document.getElementById('lbl-seconds').textContent = data.lblSeconds;

            document.getElementById('lang-screen').classList.add('hidden');
            const envScreen = document.getElementById('envelope-screen');
            envScreen.classList.remove('hidden');
            
            initTimer();
        }

        function openEnvelope() {
            document.querySelector('.envelope-wrapper').classList.add('open');
            setTimeout(() => {
                document.getElementById('envelope-screen').classList.add('hidden');
                document.getElementById('invitation-screen').classList.remove('hidden');
            }, 1200); 
        }

        function initTimer() {
            if (countdownInterval) clearInterval(countdownInterval);
            const targetDate = new Date('August 26, 2026 18:00:00').getTime();

            countdownInterval = setInterval(() => {
                const difference = targetDate - new Date().getTime();
                if (difference < 0) { clearInterval(countdownInterval); return; }

                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('timer-days').textContent = days.toString().padStart(2, '0');
                document.getElementById('timer-hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('timer-minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('timer-seconds').textContent = seconds.toString().padStart(2, '0');
            }, 1000);
        }

        const canvas = document.getElementById('sakura');
        const ctx = canvas.getContext('2d');
        let petals = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Petal {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height - canvas.height; this.r = Math.random() * 4 + 2; this.vX = Math.random() * 1 - 0.5; this.vY = Math.random() * 1 + 1; }
            draw() {
                if (this.y > canvas.height || this.x > canvas.width || this.x < 0) { this.x = Math.random() * canvas.width; this.y = -20; }
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI, true);
                ctx.fillStyle = 'rgba(255, 183, 197, 0.5)'; ctx.fill();
            }
            update() { this.x += this.vX; this.y += this.vY; }
        }
        for (let i = 0; i < 25; i++) petals.push(new Petal());
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); petals.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
